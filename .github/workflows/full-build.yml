name: full-high-accuracy-build

on:
  workflow_dispatch:
    inputs:
      skip_zenodo:
        description: "Skip the 931 MB ~0.9M Spotify snapshot (lower coverage/accuracy)"
        required: false
        default: false
        type: boolean
      restore_run_id:
        description: "Previous workflow run whose generated-output artifact should be restored"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.gitattributes'
      - '.github/workflows/full-build.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: beathit-full-build
  cancel-in-progress: false

jobs:
  build:
    # Avoid recursively rebuilding after the bot commits only generated data.
    if: "!contains(github.event.head_commit.message || '', '[skip full-build]')"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install full builder
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements-full.txt pytest

      - name: Run builder regression tests
        run: pytest -q

      - name: Restore large-source cache
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/full_build
            .cache/full_build
          key: beathit-sources-v5-${{ runner.os }}
          restore-keys: |
            beathit-sources-v5-${{ runner.os }}-

      - name: Restore legacy resumable builder checkpoints
        id: restore-builder-checkpoints
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/full_build/vocadb_original_youtube_scan.jsonl
            .cache/full_build/vocadb_original_youtube_scan.meta.json
            .cache/full_build/vocadb_youtube_view_counts.json
            .cache/full_build/kpop_youtube_checkpoint.json
            .cache/full_build/listenbrainz_video_game_music.json
            .cache/full_build/wikidata_top_video_games.json
          key: beathit-builder-checkpoints-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            beathit-builder-checkpoints-v2-${{ runner.os }}-

      - name: Restore current builder checkpoints
        id: current-checkpoints
        uses: actions/cache/restore@v4
        with:
          path: .cache/full_build
          key: beathit-builder-checkpoints-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            beathit-builder-checkpoints-v3-${{ runner.os }}-

      - name: Restore generated outputs from previous run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: beathit-full-build-output
          path: .restore-output
          github-token: ${{ github.token }}
          run-id: ${{ inputs.restore_run_id }}

      - name: Import restored outputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_run_id != '' }}
        run: python scripts/restore_outputs.py .restore-output

      - name: Build all requested lists
        id: generate
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PYTHONUNBUFFERED: '1'
          BEATHIT_SKIP_ZENODO: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_zenodo && '1' || '0' }}
          BEATHIT_RYD_FALLBACK: '1'
          BEATHIT_RYD_WORKERS: '20'
          # AnimeThemes supplies the bulk mapping; Jikan is only a resilient post-pass.
          BEATHIT_JIKAN_MAX_QUERIES: ${{ vars.BEATHIT_JIKAN_MAX_QUERIES || '1000' }}
          BEATHIT_JIKAN_INDEX_PAGES: ${{ vars.BEATHIT_JIKAN_INDEX_PAGES || '240' }}
          BEATHIT_JIKAN_MAX_SECONDS: ${{ vars.BEATHIT_JIKAN_MAX_SECONDS || '1800' }}
          BEATHIT_JIKAN_FAILURE_BREAKER: '12'
          BEATHIT_YTDLP_FALLBACK: '0'
          BEATHIT_HOLOLIVE_ROUND_DOWN: ${{ vars.BEATHIT_HOLOLIVE_ROUND_DOWN || '100000' }}
          BEATHIT_VOCADB_SCAN_LIMIT: ${{ vars.BEATHIT_VOCADB_SCAN_LIMIT || '350000' }}
          BEATHIT_VOCALOID_VIEW_CACHE_DAYS: ${{ vars.BEATHIT_VOCALOID_VIEW_CACHE_DAYS || '30' }}
          BEATHIT_KPOP_VIEW_CACHE_DAYS: ${{ vars.BEATHIT_KPOP_VIEW_CACHE_DAYS || '7' }}
          BEATHIT_KPOP_SEARCH_CALL_BUDGET: ${{ vars.BEATHIT_KPOP_SEARCH_CALL_BUDGET || '59' }}
          BEATHIT_KPOP_GENERIC_SEARCHES: ${{ vars.BEATHIT_KPOP_GENERIC_SEARCHES || '0' }}
          BEATHIT_COUNTRY_WORKERS: ${{ vars.BEATHIT_COUNTRY_WORKERS || '4' }}
        run: |
          python scripts/build_full_dataset.py --reuse-complete

      - name: Save resumable builder checkpoints
        if: ${{ always() && steps.generate.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/full_build
          key: beathit-builder-checkpoints-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save large-source cache
        if: ${{ always() && steps.generate.outcome == 'success' && steps.source-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/full_build
            .cache/full_build
          key: beathit-sources-v5-${{ runner.os }}

      - name: Validate generated datasets
        id: validation
        continue-on-error: true
        run: |
          set +e
          status=0
          python -m music_megalist validate || status=$?
          python scripts/verify_targets.py > data/target_report.json || status=$?
          # A strict completion check is recorded but does not fabricate/pad a finite corpus.
          if python -m music_megalist validate --complete > data/complete_validation.txt 2>&1; then
            echo "Strict fixed-target validation passed" >> data/complete_validation.txt
          else
            status=1
            echo "Strict fixed-target validation did not pass; see source-backed shortfalls above." >> data/complete_validation.txt
          fi
          exit "$status"

      - name: Update checksums after validation reports
        if: ${{ always() && steps.generate.outcome == 'success' }}
        run: python scripts/update_manifest.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beathit-full-build-output
          path: |
            STATUS.json
            data/MANIFEST.json
            data/hololive_coverage.json
            data/BUILD_REPORT.json
            data/coverage_report.csv
            data/target_report.json
            data/complete_validation.txt
            data/anime/*.csv
            data/vocaloid/*.csv*
            data/worldwide/*.csv
            data/classical/*.csv
            data/vtuber_original/*.csv
            data/vtuber_non_original/*.csv
            data/emerging/*.csv
            data/genres/*.csv
            data/screen_soundtracks/*.csv
            data/countries/*
            data/megalist/*
            data/video_games/*.csv
            data/kpop/*.csv
            data/internet_native/*.csv
            data/electronic_subcultures/*.csv
            data/alternative_extreme/*.csv
            data/jazz_depth/*.csv
            data/children_childhood/*.csv
            data/unserious/*.csv
            data/special_required/*.csv

      - name: Upload resumable builder checkpoints
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beathit-builder-checkpoints
          include-hidden-files: true
          path: .cache/full_build

      - name: Commit generated datasets and reports together
        if: ${{ always() && steps.generate.outcome == 'success' }}
        run: |
          git config user.name "BeatHit Dataset Builder"
          git config user.email "actions@users.noreply.github.com"
          python scripts/stage_generated.py
          if ! git diff --cached --quiet; then
            git commit -m "Build and validate source-backed BeatHit datasets [skip full-build]"
            git push origin HEAD:main
          fi

      - name: Propagate validation failure
        if: ${{ steps.validation.outcome == 'failure' }}
        run: exit 1
