name: validate-datasets
on:
  push:
    paths: ['data/**', 'STATUS.json']
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest
      - run: pytest -q
      - run: python -m music_megalist validate
